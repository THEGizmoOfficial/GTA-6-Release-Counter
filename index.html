<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <title>Licznik do wydania GTA VI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="timeCounter">
        <div class="timeCircle" style="--color:#f7931e;">
            <div class="dots dayDot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
                <circle cx="70" cy="70" r="70" id="dd"></circle>
            </svg>
            <div id="day">00</div>
        </div>
        <div class="timeCircle" style="--color:#f7931e;">
            <div class="dots hourDot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
                <circle cx="70" cy="70" r="70" id="hh"></circle>
            </svg>
            <div id="hour">00</div>
        </div>
        <div class="timeCircle" style="--color:#f7931e;">
            <div class="dots minuteDot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
                <circle cx="70" cy="70" r="70" id="mm"></circle>
            </svg>
            <div id="minute">00</div>
        </div>
        <div class="timeCircle" style="--color:#f7931e;">
            <div class="dots secondDot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
                <circle cx="70" cy="70" r="70" id="ss"></circle>
            </svg>
            <div id="second">00</div>
        </div>
    </div>
    <div id="preorderSection">

        <h2>Start Przedsprzedaży</h2>

        <div id="preorderCounter">
            <div id="preorderDays">00</div>
            <div id="preorderHours">00</div>
            <div id="preorderMinutes">00</div>
            <div id="preorderSeconds">00</div>
        </div>

        <div id="preorderButtons">
            <a href="https://www.playstation.com/pl-pl/games/grand-theft-auto-vi/" target="_blank">
                Przedsprzedaż PS5
            </a>

            <a href="https://www.xbox.com/en-US/games/store/grand-theft-auto-vi/9nl3wwnzlzzn" target="_blank">
                Przedsprzedaż Xbox Series X|S
            </a>

        </div>

    </div>
    <a class="announcement" target="_blank" href="https://www.youtube.com/@RockstarGames">GTA VI</a>
    <script type="text/javascript" src="script.js"></script>
</body>

</html>
